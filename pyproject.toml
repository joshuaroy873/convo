[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convo-tui"
version = "0.1.0"
description = "Terminal manager for Claude Code, Codex and Antigravity (agy) conversations: browse, search, resume, rename, trash and export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Roy Palathinkal" }]
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]
keywords = ["claude", "codex", "antigravity", "tui", "conversations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/joshuaroy873/convo"
Issues = "https://github.com/joshuaroy873/convo/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build"]

[project.scripts]
convo = "convo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
